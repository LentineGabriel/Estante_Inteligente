name: Biblioteca API CI Pipeline

# Dispara o pipeline em pushes ou pull requests para a branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Realiza checagem estática de código (Linting e Formatação)
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar Ferramentas de Linting
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Executar Checagem de Formatação (Black)
        run: black --check back-end/

      - name: Executar Análise Estática de Código (Ruff)
        run: ruff check back-end/

  # Job 2: Valida se a imagem Docker do back-end constrói perfeitamente
  docker-build-test:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validar Build da Imagem Docker (Multi-stage)
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          file: ./back-end/Dockerfile
          push: false # Apenas valida a construção da imagem, sem subir para o Docker Hub
          tags: biblioteca_api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
